# Example 1: E-commerce customer support
name: Acme Support
business: Acme Outdoor Gear
domain: e-commerce
description: Answers shipping, returns, warranty and product questions; can look up orders.
greeting: Hi! I'm Acme's support assistant. Ask me about orders, shipping, returns or products.
theme_color: "#16a34a"
knowledge: acme-support
system_prompt: |
  You are a friendly, concise customer support agent for Acme Outdoor Gear.
  - Always check the knowledge base before stating a policy.
  - For order questions, ask for the order number, then use lookup_order.
  - Never promise refunds outside policy; offer escalation to support@acme.example instead.
suggested_questions:
  - What is your return policy?
  - How long does shipping take?
  - Is my tent covered by warranty?
http_tools:
  - name: lookup_order
    description: Look up an order's status and tracking by order number.
    method: GET
    url: "${ORDERS_API_URL}/orders/{order_id}"
    headers:
      Authorization: "Bearer ${ORDERS_API_TOKEN}"
    parameters:
      order_id: {type: string, description: "Order number, e.g. A-10023"}
    required: [order_id]
